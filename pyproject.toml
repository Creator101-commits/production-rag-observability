[project]
name = "production-rag-observability"
version = "0.1.0"
description = "A citation-grounded question-answering service with observable retrieval and generation stages."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreeharsha Kannegundla" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "typer>=0.12",
    "pypdf>=5.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
neural = [
    "torch>=2.4",
    "transformers>=4.44,<5",
    "accelerate>=0.33",
    "sentence-transformers>=3.0",
    "lm-format-enforcer>=0.11",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
rag-service = "rag_system.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Constrained-decoding schema tests run without the neural extra; the
    # bound <0.12 matches the version verified on Kaggle (0.11.3).
    "lm-format-enforcer>=0.11,<0.12",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_system --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
